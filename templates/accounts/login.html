{% extends 'base.html' %}
{% block title %}Login | Project Management{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container auth-panel glass-card">
        <h2>Welcome Back</h2>
        <p>Don’t have an account? <a href="/signup/">Sign up</a></p>
        <form method="post" autocomplete="off" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-grid">
                <label>Username</label>
                {{ form.username }}
            </div>
            <div class="form-grid">
                <label>Password</label>
                <div class="input-with-icon">
                    {{ form.password }}
                    <input type="checkbox" id="login-show-pass" class="eye-toggle-checkbox">
                    <label for="login-show-pass" class="eye-toggle-label"></label>
                </div>
                <div style="text-align: right; margin-top: 5px;">
                    <a href="{% url 'forgot_password' %}" style="font-size: 0.85rem; color: #4ade80; text-decoration: none; opacity: 0.9;">Forgot password?</a>
                </div>
            </div>
            <button class="button" type="submit" style="margin-top: 10px;">Login</button>
        </form>
    </div>
</section>
{% endblock %}

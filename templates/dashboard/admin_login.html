{% extends 'base.html' %}
{% block title %}Admin Login | Project Management{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container auth-panel glass-card">
        <h2>Admin Sign In</h2>
        <p>Enter admin credentials to manage approvals.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-grid">
                <label>Username</label>
                {{ form.username }}
            </div>
            <div class="form-grid">
                <label>Password</label>
                {{ form.password }}
            </div>
            <button class="button" type="submit">Sign In</button>
        </form>
    </div>
</section>
{% endblock %}
